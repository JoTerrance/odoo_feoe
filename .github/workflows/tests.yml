name: Odoo Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: odoo_feoe

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          libxml2-dev \
          libxslt1-dev \
          libldap2-dev \
          libsasl2-dev \
          libjpeg-dev \
          libpq-dev \
          postgresql-client

    - name: Clone Odoo
      run: |
        git clone --depth 1 --branch 15.0 https://github.com/odoo/odoo.git odoo

    - name: Install Odoo dependencies
      run: |
        pip install --upgrade pip
        pip install -r odoo/requirements.txt
        pip install coverage

    - name: Create Odoo config
      run: |
        cat > odoo.conf << EOF
        [options]
        addons_path = odoo/addons,odoo_feoe
        db_host = localhost
        db_port = 5432
        db_user = odoo
        db_password = odoo
        EOF

    - name: Initialize test database
      run: |
        python odoo/odoo-bin -c odoo.conf -d test_db -i odoo_feoe --stop-after-init --test-enable --log-level=warn

    - name: Run tests with coverage
      run: |
        coverage run --source=odoo_feoe odoo/odoo-bin -c odoo.conf -d test_db -u odoo_feoe --stop-after-init --test-enable --log-level=test
      continue-on-error: false

    - name: Generate coverage report
      run: |
        coverage report
        coverage xml

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.xml
      if: always()
